<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TransitIQ - Smart Transport System</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: linear-gradient(135deg, #e3f2fd, #f1f8e9);
    }

    header {
      background-color: #0d47a1;
      color: white;
      text-align: center;
      padding: 25px 10px 40px 10px;
    }

    header img {
      width: 120px;
      display: block;
      margin: 0 auto 10px auto;
    }

    header h1 {
      font-size: 50px;
      margin: 10px 0 15px 0;
    }

    header p {
      font-size: 20px;
      line-height: 30px;
      max-width: 900px;
      margin: auto;
    }

    nav {
      background-color: #1565c0;
      text-align: center;
      padding: 12px;
    }

    nav a {
      color: white;
      text-decoration: none;
      margin: 0 20px;
      font-size: 18px;
      font-weight: bold;
    }

    nav a:hover {
      color: #ffeb3b;
    }

    section {
      background-color: white;
      width: 85%;
      margin: 40px auto;
      padding: 30px;
      border-radius: 14px;
      box-shadow: 0 6px 18px rgba(0,0,0,0.15);
      text-align: center;
    }

    section h2 {
      font-size: 45px;
      color: #1b5e20;
    }

    .images {
      display: flex;
      justify-content: center;
      gap: 25px;
      flex-wrap: wrap;
      margin-top: 25px;
    }

    .images img {
      width: 40%;
      min-width: 260px;
      border-radius: 12px;
      box-shadow: 0 4px 14px rgba(0,0,0,0.25);
    }

    footer {
      background-color: #263238;
      color: white;
      text-align: center;
      padding: 15px;
      margin-top: 40px;
    }
  </style>
</head>
<body>

  <header>
    <img src="logo2.png" alt="TransitIQ Logo">
    <h1>TransitIQ - Smart Transport System</h1>
    <p>
      TransitIQ is a smart intercept mobility platform that helps passengers
      catch a missed bus by booking a short on-demand ride to its next upcoming stop,
      saving time and money.
    </p>
  </header>

  <nav>
    <a href="Services3.html">Go to Track</a>
  </nav>

  <section>
    <h2>Track & Catch Up</h2>
    <div class="images">
      <img src="image1.png" alt="Tracking">
      <img src="image2.png" alt="Ride Catch">
    </div>
  </section>

  <footer>
    © 2026 TransitIQ - Smart Transport System
  </footer>

</body>
</html>
